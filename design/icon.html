<!doctype html>
<!--
  App icon source. Render at any square size:
    icon.html?size=512            standard icon (transparent corners)
    icon.html?size=512&maskable=1 full-bleed background, art inside the 80% safe zone
    &scale=0.78                   override the art size (fraction of the icon)
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  .icon { position: relative; display: grid; place-items: center; }
  .icon.maskable { background: radial-gradient(circle at 50% 45%, #3a2416, #120d0b 75%); }
  .face {
    display: grid; place-items: center; box-sizing: border-box;
    background: linear-gradient(160deg, #fbf3e2, #e5d5b4);
    border: solid #c8902a;
    box-shadow: inset 0 0 0 1px rgba(90, 60, 30, 0.25), 0 0 0 1px rgba(0, 0, 0, 0.35);
  }
  .face span {
    font-family: 'Cinzel', Georgia, serif; font-weight: 700; line-height: 1;
    color: #a3141c; text-shadow: 0 2px 0 rgba(255, 255, 255, 0.6);
  }
</style>
</head>
<body>
  <div class="icon" id="icon"><div class="face"><span>!</span></div></div>
  <script>
    const q = new URLSearchParams(location.search);
    const size = Number(q.get('size') || 512);
    const maskable = q.get('maskable') === '1';
    const icon = document.getElementById('icon');
    const face = icon.firstElementChild;
    icon.style.width = icon.style.height = size + 'px';
    if (maskable) icon.classList.add('maskable');
    const f = size * Number(q.get('scale') || (maskable ? 0.62 : 1));
    face.style.width = face.style.height = f + 'px';
    face.style.borderRadius = f * 0.22 + 'px';
    face.style.borderWidth = Math.max(1, f * 0.06) + 'px';
    face.firstElementChild.style.fontSize = f * 0.72 + 'px';
    face.firstElementChild.style.marginTop = f * 0.06 + 'px';
  </script>
</body>
</html>
